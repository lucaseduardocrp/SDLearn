services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sdlearn
      POSTGRES_USER: sdlearn
      POSTGRES_PASSWORD: sdlearn
    ports:
      - "5432:5432"
    volumes:
      - sdlearn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlearn -d sdlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sdlearn-postgres-data: