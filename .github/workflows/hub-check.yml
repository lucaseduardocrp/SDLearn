name: Hub packs

on:
  pull_request:
    paths: ["hub/**", "services/shared/**"]
  push:
    branches: [main]
    paths: ["hub/**", "services/shared/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate every pack
        run: npm run hub:check
